<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="1.6in" height="2.0in" viewBox="0 0 1600 2000"
     id="svg_esp32_cam_sch">
  <g id="schematic">
    <rect x="200" y="80" width="1200" height="1840" fill="#fefefe" stroke="#373435" stroke-width="12"/>
    <text x="800" y="180" text-anchor="middle" font-family="Droid Sans, sans-serif" font-size="56" fill="#1a1a1a">ESP32-CAM</text>
    <text x="800" y="250" text-anchor="middle" font-family="Droid Sans, sans-serif" font-size="40" fill="#555555">AI-Thinker (no camera)</text>
    <text x="800" y="980" text-anchor="middle" font-family="Droid Sans, sans-serif" font-size="36" fill="#666666">SD_MMC onboard</text>
    <text x="800" y="1040" text-anchor="middle" font-family="Droid Sans, sans-serif" font-size="32" fill="#666666">CLK=14 CMD=15 D0=2</text>
    <text x="800" y="1120" text-anchor="middle" font-family="Droid Sans, sans-serif" font-size="30" fill="#888888">No TFT / No SPI SD CS</text>

    <!-- Left pins -->
    <line id="connector0pin" x1="200" y1="360" x2="100" y2="360" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector0terminal" x="95" y="355" width="10" height="10" fill="none"/>
    <text x="220" y="372" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">3V3</text>

    <line id="connector1pin" x1="200" y1="480" x2="100" y2="480" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector1terminal" x="95" y="475" width="10" height="10" fill="none"/>
    <text x="220" y="492" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GND</text>

    <line id="connector2pin" x1="200" y1="600" x2="100" y2="600" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector2terminal" x="95" y="595" width="10" height="10" fill="none"/>
    <text x="220" y="612" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GPIO4</text>

    <line id="connector3pin" x1="200" y1="720" x2="100" y2="720" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector3terminal" x="95" y="715" width="10" height="10" fill="none"/>
    <text x="220" y="732" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GPIO5</text>

    <line id="connector4pin" x1="200" y1="840" x2="100" y2="840" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector4terminal" x="95" y="835" width="10" height="10" fill="none"/>
    <text x="220" y="852" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GPIO18</text>

    <line id="connector5pin" x1="200" y1="960" x2="100" y2="960" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector5terminal" x="95" y="955" width="10" height="10" fill="none"/>
    <text x="220" y="972" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GPIO19</text>

    <line id="connector6pin" x1="200" y1="1080" x2="100" y2="1080" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector6terminal" x="95" y="1075" width="10" height="10" fill="none"/>
    <text x="220" y="1092" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GPIO23</text>

    <line id="connector14pin" x1="200" y1="1200" x2="100" y2="1200" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector14terminal" x="95" y="1195" width="10" height="10" fill="none"/>
    <text x="220" y="1212" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">5V</text>

    <!-- Right pins -->
    <line id="connector7pin" x1="1400" y1="360" x2="1500" y2="360" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector7terminal" x="1495" y="355" width="10" height="10" fill="none"/>
    <text x="1380" y="372" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GPIO25</text>

    <line id="connector8pin" x1="1400" y1="480" x2="1500" y2="480" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector8terminal" x="1495" y="475" width="10" height="10" fill="none"/>
    <text x="1380" y="492" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GPIO26</text>

    <line id="connector9pin" x1="1400" y1="600" x2="1500" y2="600" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector9terminal" x="1495" y="595" width="10" height="10" fill="none"/>
    <text x="1380" y="612" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GPIO27</text>

    <line id="connector10pin" x1="1400" y1="720" x2="1500" y2="720" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector10terminal" x="1495" y="715" width="10" height="10" fill="none"/>
    <text x="1380" y="732" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GPIO32</text>

    <line id="connector11pin" x1="1400" y1="840" x2="1500" y2="840" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector11terminal" x="1495" y="835" width="10" height="10" fill="none"/>
    <text x="1380" y="852" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GPIO2 SD</text>

    <line id="connector12pin" x1="1400" y1="960" x2="1500" y2="960" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector12terminal" x="1495" y="955" width="10" height="10" fill="none"/>
    <text x="1380" y="972" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GPIO14 SD</text>

    <line id="connector13pin" x1="1400" y1="1080" x2="1500" y2="1080" stroke="#999999" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect id="connector13terminal" x="1495" y="1075" width="10" height="10" fill="none"/>
    <text x="1380" y="1092" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="36" fill="#1a1a1a">GPIO15 SD</text>
  </g>
</svg>
