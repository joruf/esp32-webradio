<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="1.8in" height="1.4in" viewBox="0 0 1800 1400"
     id="svg_esp32_cam_bb">
  <g id="breadboard">
    <!-- Board body -->
    <rect x="250" y="120" width="1300" height="1160" rx="40" ry="40" fill="#1a5c2e" stroke="#0d3318" stroke-width="8"/>
    <rect x="480" y="280" width="420" height="320" rx="12" ry="12" fill="#222222" stroke="#111111" stroke-width="4"/>
    <text x="900" y="220" text-anchor="middle" font-family="Droid Sans, sans-serif" font-size="56" fill="#e8ffe8">ESP32-CAM</text>
    <text x="900" y="700" text-anchor="middle" font-family="Droid Sans, sans-serif" font-size="36" fill="#cfe8cf">no camera</text>
    <text x="900" y="780" text-anchor="middle" font-family="Droid Sans, sans-serif" font-size="32" fill="#a8d0a8">SD slot onboard</text>
    <text x="900" y="840" text-anchor="middle" font-family="Droid Sans, sans-serif" font-size="28" fill="#8fbf8f">MMC CLK14 CMD15 D0=2</text>
    <!-- SD slot visual -->
    <rect x="1050" y="300" width="360" height="80" rx="8" ry="8" fill="#333333" stroke="#111111" stroke-width="3"/>
    <text x="1230" y="352" text-anchor="middle" font-family="Droid Sans, sans-serif" font-size="28" fill="#cccccc">microSD</text>

    <!-- Left male pins (bottom tip is connection point) -->
    <line id="connector0pin" x1="250" y1="220" x2="120" y2="220" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="260" y="210" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">3V3</text>

    <line id="connector1pin" x1="250" y1="340" x2="120" y2="340" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="260" y="330" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">GND</text>

    <line id="connector2pin" x1="250" y1="460" x2="120" y2="460" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="260" y="450" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">4</text>

    <line id="connector3pin" x1="250" y1="580" x2="120" y2="580" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="260" y="570" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">5</text>

    <line id="connector4pin" x1="250" y1="700" x2="120" y2="700" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="260" y="690" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">18</text>

    <line id="connector5pin" x1="250" y1="820" x2="120" y2="820" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="260" y="810" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">19</text>

    <line id="connector6pin" x1="250" y1="940" x2="120" y2="940" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="260" y="930" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">23</text>

    <line id="connector14pin" x1="250" y1="1060" x2="120" y2="1060" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="260" y="1050" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">5V</text>

    <!-- Right male pins -->
    <line id="connector7pin" x1="1550" y1="220" x2="1680" y2="220" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="1540" y="210" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">25</text>

    <line id="connector8pin" x1="1550" y1="340" x2="1680" y2="340" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="1540" y="330" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">26</text>

    <line id="connector9pin" x1="1550" y1="460" x2="1680" y2="460" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="1540" y="450" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">27</text>

    <line id="connector10pin" x1="1550" y1="580" x2="1680" y2="580" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="1540" y="570" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">32</text>

    <line id="connector11pin" x1="1550" y1="700" x2="1680" y2="700" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="1540" y="690" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">2 SD</text>

    <line id="connector12pin" x1="1550" y1="820" x2="1680" y2="820" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="1540" y="810" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">14 SD</text>

    <line id="connector13pin" x1="1550" y1="940" x2="1680" y2="940" stroke="#c0a060" stroke-width="18" stroke-linecap="round"/>
    <text x="1540" y="930" text-anchor="end" font-family="Droid Sans, sans-serif" font-size="28" fill="#e8ffe8">15 SD</text>
  </g>
</svg>
