; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Setzt die Baudrate für den Seriellen Monitor auf deinen Code-Standard
monitor_speed = 115200

; Schaltet das Partitionsschema auf "Huge App" (3MB ohne OTA), wie im Code gefordert
board_build.partitions = huge_app.csv

; Automatische Verwaltung externer Bibliotheken
; EventDrivenButtonHandler: https://github.com/joruf/event-driven-button-handler
; ArduinoTaskScheduler: https://github.com/joruf/task-scheduler
; Local dev alternative: file://../../GitHub/event-driven-button-handler
; Local dev alternative: file://../../GitHub/task-scheduler
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    bblanchon/ArduinoJson @ ^7.2.0
    https://github.com/joruf/event-driven-button-handler.git
    https://github.com/joruf/task-scheduler.git

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0