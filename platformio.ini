; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Only the firmware is built by default (`pio run`).
; Host unit tests run explicitly via `pio test -e native`.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Setzt die Baudrate für den Seriellen Monitor auf deinen Code-Standard
monitor_speed = 115200

; Dual OTA slots (~1.875 MB each); required for web/HTTP firmware updates.
; SPIFFS minimized (unused) to give the freed flash to the app slots.
; One-time USB flash needed after changing the partition table.
board_build.partitions = partitions/ota_app.csv

; Generate C headers from HTML partials (e.g. nav_menu.html -> nav_menu.h)
extra_scripts = pre:scripts/pio_embed_web_assets.py

; Automatische Verwaltung externer Bibliotheken
; EventDrivenButtonHandler: https://github.com/joruf/event-driven-button-handler
; ArduinoTaskScheduler: https://github.com/joruf/task-scheduler
; Local dev alternative: file://../../GitHub/event-driven-button-handler
; Local dev alternative: file://../../GitHub/task-scheduler
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    bblanchon/ArduinoJson @ ^7.2.0
    https://github.com/joruf/event-driven-button-handler.git
    file://../../GitHub/task-scheduler

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; ESP32-CAM (no camera) + VS1053 + encoder + onboard SD_MMC. No TFT libs.
; Flash with: pio run -e esp32cam -t upload
; OTA: use the cam firmware image, not the WROOM one.
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/ota_app.csv
board_build.f_flash = 40000000L
board_build.flash_mode = dio
; PSRAM is enabled via BOARD_HAS_PSRAM; do not pass -mfix=* (unsupported on
; current xtensa-esp-elf toolchains used by Arduino-ESP32 3.x / platform 55+).
build_flags =
    -DDUMMYTFT
    -DHW_PROFILE_DEFAULT=\"cam_headless\"
    -DBOARD_HAS_PSRAM
extra_scripts = pre:scripts/pio_embed_web_assets.py
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
    https://github.com/joruf/event-driven-button-handler.git
    file://../../GitHub/task-scheduler
lib_ignore =
    Adafruit GFX Library
    Adafruit ST7735 and ST7789 Library
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; Waveshare ESP32-S3-Touch-LCD-2.8B (ST7701 RGB 480x640 + GT911).
; Flash with: pio run -e esp32s3_touch28b -t upload
; Pin map: wiring/pin_connections.txt section s3_touch_28b
; VS1053 CS/DCS via MCP23017 @0x27 (GPA0/GPA1); MISO/DREQ on D-/D+ (OTA while wired)
[env:esp32s3_touch28b]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/ota_app_16mb.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
build_flags =
    -DST7701_28B
    -DUSE_MCP23017_VS1053
    -DHW_PROFILE_DEFAULT=\"s3_touch_28b\"
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; Soft-decode radio PCM -> I2S master TX (43/44/16); WROOM is I2S slave RX.
    ; Keeps ST7701 + WiFi; disables VS1053 SPI on those pins.
    -DRADIO_I2S_A2DP_TX=1
extra_scripts =
    pre:scripts/pio_embed_web_assets.py
    pre:scripts/patch_audio_i2s_decode_only.py
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
    https://github.com/joruf/event-driven-button-handler.git
    file://../../GitHub/task-scheduler
    moononournation/GFX Library for Arduino @ ^1.5.9
    https://github.com/schreibfaul1/ESP32-audioI2S.git
lib_ignore =
    Adafruit GFX Library
    Adafruit ST7735 and ST7789 Library
; If auto-reset fails (USB-JTAG RTS errno 71): hold BOOT, tap RESET, then
;   pio run -e esp32s3_touch28b -t upload --upload-port /dev/ttyACM0
; with upload_flags below temporarily, or use scripts/flash_touch28b_manual.sh
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_filters = esp32_exception_decoder

; ST7701 color-cycle smoke test only (no webradio firmware).
; Flash: pio run -e esp32s3_display_test -t upload
[env:esp32s3_display_test]
extends = env:esp32s3_touch28b
build_src_filter = -<*> +<../examples/st7701_smoke/main.cpp>
extra_scripts =
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.5.9
build_flags =
    -DST7701_28B
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Isrc

; ESP32-S3 I2S master TX tone for A2DP bridge (pairs with esp32_a2dp_source).
; Isolated from webradio. Flash: pio run -e esp32s3_i2s_a2dp_tx -t upload
; Pins: BCLK=43 (TXD) LRCK=44 (RXD) DOUT=16; UART0 hijacked -> use USB CDC
; Wiring: wiring/pin_connections.txt section 5) A2DP I2S bridge
[env:esp32s3_i2s_a2dp_tx]
extends = env:esp32s3_touch28b
build_src_filter = -<*> +<../examples/i2s_a2dp_tx/main.cpp>
extra_scripts =
lib_deps =
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Iexamples/i2s_a2dp_tx
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; ESP32-WROOM Classic Bluetooth A2DP Source (headphones/speaker bridge).
; Isolated from webradio src/main.cpp. Flash: pio run -e esp32_a2dp_source -t upload
; Optional named sink: build_flags += -DBT_SINK_NAME=\"My\\ Headphones\"
; I2S slave RX pins (S3 is master TX): BCLK=26 LRCK=25 DIN=32
; Wiring: wiring/pin_connections.txt section 5) A2DP I2S bridge
[env:esp32_a2dp_source]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<../examples/a2dp_source/main.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Legacy I2S slave RX from S3 master TX; silence when no PCM (no local 440 Hz).
    -DA2DP_USE_I2S_INPUT=1
    -Iexamples/a2dp_source
    ; Linux PC A2DP Sink alias (bluetoothctl Alias). Empty = first sink.
    -DBT_SINK_NAME=\"Xiaomi-i7-LinuxMint\"
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git
lib_ignore =
    Adafruit GFX Library
    Adafruit ST7735 and ST7789 Library
extra_scripts =
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
monitor_filters = esp32_exception_decoder

; Host-based unit tests for hardware-independent logic.
; Run with:  pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = no
; Never pull the firmware sources into the native (host) build.
build_src_filter = -<*>
build_flags =
    -std=c++17
    -I src
    -I test/stubs
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0